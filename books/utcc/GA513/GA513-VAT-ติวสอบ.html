   1. FOUNDATION DATA — ปูพื้นก่อนเข้าเนื้อหา
   ============================================================ */
const foundationData = [
  {
    key: 'bigpicture',
    title: '🗺️ ภาพใหญ่: VAT เก็บจากอะไร ใครจ่ายจริง (First Principles)',
    tags: [['เข้าใจก่อนท่อง','green'],['อ่าน 3 นาที','blue']],
    content: () => (
      <div>
        <Paragraph>

          ไม่ใช่เก็บซ้ำจากราคาเต็มทุกทอด กลไกที่ทำให้เป็นแบบนั้นคือ <strong>เครดิตภาษีซื้อ</strong>

            เรียกเก็บภาษีขายแทนรัฐ เครดิตภาษีซื้อคืน แล้วนำส่งเฉพาะส่วนต่าง ดังนั้น
            <strong> ภาษีซื้อไม่ใช่ "ค่าใช้จ่าย" และภาษีขายไม่ใช่ "รายได้"</strong> ของกิจการ (จุดที่อาจารย์วงไว้ในชีท)</Text>

            <li><strong>คำนวณและยื่นอย่างไร?</strong> — ภาษีขาย − ภาษีซื้อ → นำส่ง/ขอคืน ด้วย ภ.พ.30 ภายในวันที่ 15 ของเดือนถัดไป</li>

          <Text><strong>ยกเว้น (เช่น ขายพืชผลเกษตร):</strong> อยู่นอกระบบ — ไม่เก็บภาษีขาย แต่<strong>ภาษีซื้อเครดิตไม่ได้</strong> ต้องกลายเป็นต้นทุน{'\n'}</Text>

          <Text type="secondary">ใช้ตอบ: โจทย์เคส "แบบนี้ต้องเสีย VAT ไหม" — เช็คก่อนว่าเข้านิยามขายกว้างหรือไม่ แล้วค่อยหาข้อยกเว้น</Text>

          <Text type="secondary">ใช้ตอบ: ทุกข้อ Tax Point — เริ่มจากหลักใหญ่ แล้วถามว่ามีเหตุการณ์ใดเกิดก่อนไหม</Text>
        </MiniCard>

  { q: '"ขาย" ตามนิยาม VAT ต้องมีค่าตอบแทนหรือไม่? ยกตัวอย่างขายที่ไม่ได้เงิน', a: 'ไม่ต้อง — จำหน่าย จ่าย โอน ไม่ว่าจะมีประโยชน์ตอบแทนหรือไม่', d: 'เช่น แจกสินค้า (นอกเกณฑ์ตัวอย่าง), นำสินค้าไปใช้นอกกิจการ, แลกเปลี่ยน/เทิร์นสินค้า, สินค้าขาดจาก stock, สินค้าคงเหลือวันเลิกกิจการ — ใช้ราคาตลาดเป็นฐาน', star: 3, exam: false },
  { q: 'แจกของตัวอย่าง กับ ของแถม อะไรเป็นการขาย อะไรไม่เป็น?', a: 'แจกตัวอย่าง/ทดลองใช้ก่อนซื้อ/แถมมูลค่าไม่เกินสินค้า = ไม่เป็นขาย · แถม/แจกมูลค่าเกิน = เป็นขาย', d: 'หลักคือของแถมต้องมูลค่าไม่เกินกว่าสินค้า/บริการที่ขาย และการแจกต้องเข้าลักษณะส่งเสริมการขาย/ตัวอย่าง — เกินเกณฑ์ = เสีย VAT จากราคาตลาด', star: 3, exam: true },
  { q: 'นำสินค้าของกิจการไปใช้เอง เมื่อไรไม่ถือเป็นขาย? มีข้อยกเว้นอะไร?', a: 'ใช้เพื่อประกอบกิจการตนเองโดยตรง = ไม่เป็นขาย — แต่ไม่รวมรถยนต์นั่ง ≤10 ที่นั่ง', d: 'เอารถยนต์นั่งออกใช้ = ถือเป็นขาย (เว้นจอดในสถานแสดงรถเพื่อขาย) · เครื่องแบบพนักงานแจกได้ปีละ 2 ชุด + เสื้อนอก 1 ตัว ไม่เป็นขาย', star: 2, exam: false },
  { q: 'บริการทำในไทยแต่ลูกค้าใช้ในต่างประเทศ (เช่น เขียนซอฟต์แวร์ให้บริษัทต่างชาติ) — VAT อย่างไร?', a: 'อยู่ในข่าย VAT แต่ได้อัตรา 0%', d: 'บริการเข้าข่าย "ในราชอาณาจักร" ทั้ง 3 คู่: ทำไทย+ใช้ไทย (7%), ทำไทย+ใช้ตปท. (0%), ทำตปท.+ใช้ไทย (7% เช่น โฆษณาบน Platform ต่างชาติ)', star: 3, exam: true },
  { q: 'Tax Point ของการขายสินค้าทั่วไป คือเมื่อไร?', a: 'เมื่อส่งมอบ — เว้นแต่โอนกรรมสิทธิ์ / รับชำระ / ออกใบกำกับ เกิดก่อน', d: 'หลักใหญ่ 3 คำ: สินค้า=ส่งมอบ บริการ=รับเงิน นำเข้า=ผ่านศุลกากร · เหตุการณ์ที่มาก่อนดึง Tax Point ให้เร็วขึ้นตามส่วนที่เกิด', star: 3, exam: true },
  { q: 'Tax Point ของการให้บริการ คือเมื่อไร?', a: 'เมื่อได้รับชำระค่าบริการ — เว้นแต่ออกใบกำกับ / ได้ใช้บริการนั้นเอง เกิดก่อน', d: 'สัญญาที่กำหนดค่าตอบแทนตามส่วนของงาน → รับชำระตามส่วนของบริการที่สิ้นสุดแต่ละส่วน', star: 3, exam: true },
  { q: 'Tax Point ของเช่าซื้อ/ขายผ่อนชำระ คือเมื่อไร?', a: 'เมื่อถึงกำหนดชำระราคาแต่ละงวด (ไม่ใช่ตอนส่งมอบ)', d: 'ป.36/2536 — แม้ลูกค้าผิดนัดก็ต้องนำส่งตามงวด · ดอกเบี้ยผิดนัดรวมเป็นฐาน · ส่วนลดหลังขายยังรวมเป็นฐาน', star: 3, exam: true },
  { q: 'ฝากขายผ่านตัวแทน Tax Point เกิดเมื่อไร? เงื่อนไขสัญญาตั้งตัวแทนมีอะไร?', a: 'มีสัญญาตามเกณฑ์ → เมื่อตัวแทนส่งมอบให้ผู้ซื้อ · ไม่มีสัญญา → ผู้ฝากออกใบกำกับตอนส่งมอบให้ตัวแทน', d: 'เงื่อนไข: สัญญาเป็นลายลักษณ์อักษร + ทั้งคู่เป็นผู้ประกอบการในระบบ VAT + แจ้งสรรพากรใน 15 วัน + เก็บสัญญาที่สำนักงานใหญ่ ≥5 ปี + ตัวแทนทำรายงานสินค้าแยกของตนเอง', star: 2, exam: false },
  { q: 'Tax Point ของการส่งออก และการนำเข้า คือเมื่อไร?', a: 'พร้อมชำระอากรขาออก/ขาเข้า หรือวันวางหลักประกัน — ถ้ายกเว้นอากร = วันออกใบขนสินค้า', d: 'ทั้งสองฝั่งใช้หลักเดียวกัน: ผูกกับพิธีการศุลกากร ไม่ใช่วันทำสัญญาหรือวันรับเงิน', star: 3, exam: false },
  { q: 'Tax Point กรณีพิเศษ: ไฟฟ้า/น้ำประปา · เครื่องขายอัตโนมัติ · ขายสินค้าด้วยบัตรเครดิต · บริการด้วยบัตรเครดิต?', a: 'รับชำระ · นำเงินออกจากเครื่อง · ส่งมอบสินค้า · ออกหลักฐานใช้บัตร', d: 'กฎกระทรวง 189/2534 — ไฟฟ้า น้ำ สินค้าไม่มีรูปร่าง ส่งมอบวัดยากจึงเลื่อนไป "รับชำระ" · สินค้าขาด = ตรวจพบ · เลิกกิจการ = วันเลิก/แจ้งเลิก · ถอนทะเบียน = วันได้รับแจ้งคำสั่ง', star: 2, exam: false },
  { q: 'ฐานภาษีการขาย ไม่รวมอะไรบ้าง (4 ตัว)?', a: 'ส่วนลดขณะขาย · ค่าชดเชย/เงินอุดหนุน · ภาษีขาย · ค่าตอบแทนตามประกาศอธิบดีฯ ฉบับ 40', d: 'สำคัญสุดคือ "ส่วนลดที่ให้ขณะขาย" ไม่รวมเป็นฐาน — แต่ส่วนลดหลังขาย (เช่น เช่าซื้อ) ยังต้องรวม', star: 3, exam: false },
  { q: '[โจทย์ชีท] นำเข้า Cost 1,000 USD, Insurance 10, Freight 50, อัตรา 35 บาท/USD, อากร 20% — VAT เท่าไร?', a: 'VAT = 3,116.40 บาท (รวมภาษีอากรต้องชำระ 10,536.40)', d: 'CIF = 35,000+350+1,750 = 37,100 → อากร = 37,100×20% = 7,420 → VAT = (37,100+7,420)×7% = 3,116.40 — ฐานนำเข้า = CIF + สรรพสามิต + อากรขาเข้า', star: 3, exam: true },
  { q: 'ฐานภาษีการส่งออกใช้ราคาอะไร? รวม/ไม่รวมอะไร?', a: 'F.O.B. + สรรพสามิต + ภาษี/ค่าธรรมเนียมอื่น — ไม่รวมอากรขาออก', d: 'F.O.B. = ราคา ณ ด่านศุลกากร ไม่รวมค่าขนส่งและประกันภัย (ต่างจากนำเข้าที่ใช้ CIF ซึ่งรวม)', star: 2, exam: false },
  { q: 'กรณีใดใช้ "ราคาตลาด" เป็นฐานภาษี (ฐานพิเศษ)?', a: 'ขายต่ำกว่าราคาตลาด/ไม่มีค่าตอบแทน · นำไปใช้เอง · คงเหลือ ณ เลิกกิจการ · 0% กลายเป็น 7% · สินค้าขาดจาก Stock', d: 'ตรรกะเดียวกัน: เมื่อไม่มีราคาซื้อขายจริงที่เชื่อถือได้ กฎหมายให้เทียบราคาตลาดแทน กันการถ่ายโอนมูลค่าหนี VAT', star: 2, exam: false },
  { q: 'ภาษีซื้อต้องห้ามกลุ่มไหน "หักเป็นรายจ่าย CIT ได้"?', a: 'ค่ารับรอง (Entertainment) และกลุ่มตามประกาศฯ ฉบับ 42 เช่น รถยนต์นั่ง ≤10 ที่นั่ง, ใบกำกับอย่างย่อ', d: 'ส่วนกลุ่มห้ามทั้งคู่ (เครดิตไม่ได้ + รายจ่ายไม่ได้): ไม่มีใบกำกับ/แสดงไม่ได้, ใบกำกับผิดสาระสำคัญ, ไม่เกี่ยวกับกิจการ, ออกโดยผู้ไม่มีสิทธิ — ตอบข้อสอบเป็น 2 ชั้นเสมอ', star: 3, exam: true },
  { q: 'ภาษีซื้อจากการซื้อ/เช่ารถยนต์นั่ง ≤10 ที่นั่ง เครดิตได้หรือไม่?', a: 'ไม่ได้ (ต้องห้ามตามฉบับ 42) — แต่หักเป็นรายจ่าย CIT ได้ · เว้นกิจการขาย/ให้เช่ารถยนต์เอง', d: 'รวมถึงภาษีซื้อสินค้า-บริการที่เกี่ยวกับรถนั้น (น้ำมัน ซ่อม ประกัน) · ถ้าดัดแปลงเป็นรถ >10 ที่นั่งภายใน 3 ปี มีเงื่อนไขพิเศษ', star: 3, exam: false },
  { q: 'ใบกำกับภาษีอย่างย่อ นำมาเครดิตภาษีซื้อได้หรือไม่?', a: 'ไม่ได้ — เป็นภาษีซื้อต้องห้ามตามประกาศฯ ฉบับ 42 (แต่หักรายจ่าย CIT ได้)', d: 'เครดิตได้เฉพาะใบกำกับเต็มรูปตาม ม.86/4 ที่ครบสาระสำคัญ ไม่แก้ไข ไม่เป็นสำเนา (เว้น "เอกสารออกเป็นชุด")', star: 3, exam: false },
  { q: 'ใบกำกับภาษีเต็มรูปต้องมีข้อความ 7 ข้ออะไรบ้าง?', a: 'คำว่าใบกำกับภาษี · ชื่อ-ที่อยู่-เลขผู้ขาย(สนญ./สาขา) · ชื่อ-ที่อยู่-เลขผู้ซื้อ · เลขที่/เล่มที่ · รายการสินค้า-ปริมาณ-มูลค่า · VAT แยกชัด · วันเดือนปี', d: 'ม.86/4 · ผู้ซื้อไม่ได้จด VAT → ไม่ต้องกรอกเลขผู้ซื้อ · ขาดสาระสำคัญข้อใด = ผู้รับเครดิตไม่ได้', star: 3, exam: true },
  { q: 'ใบเพิ่มหนี้/ใบลดหนี้ ลงภาษีเดือนไหน?', a: 'ผู้ออก: เดือนที่ออก (เพิ่มหนี้=ภาษีขาย, ลดหนี้=หักภาษีขาย) · ผู้รับ: เดือนที่ได้รับ (เพิ่มหนี้=ภาษีซื้อ, ลดหนี้=หักภาษีซื้อ)', d: 'เหตุเพิ่มหนี้: ราคาเพิ่ม/ส่งเกิน/คำนวณต่ำไป · เหตุลดหนี้: ราคาลด ของชำรุด-ขาดจำนวน รับคืนสินค้า เลิกสัญญาบริการ', star: 3, exam: true },
  { q: 'ยกเลิกใบกำกับภาษีเดิมเพื่อออกฉบับใหม่ — ฉบับใหม่ใช้เลขที่และวันที่อย่างไร?', a: 'เลขที่ใหม่ แต่วัน เดือน ปี ตรงกับใบกำกับเดิม', d: 'ต้องเรียกคืนฉบับเดิมประทับ "ยกเลิก" + หมายเหตุการยกเลิกในฉบับใหม่ + ลงรายงานภาษีขายเดือนที่จัดทำฉบับใหม่ · ใบแทนใช้กรณีสูญหาย/ชำรุด (ถ่ายสำเนา+บันทึกกำกับ)', star: 2, exam: false },
  { q: 'รายการซื้อ-ขาย ต้องบันทึกลงรายงาน VAT ภายในกี่วัน? กิจการขายสินค้าต้องทำรายงานอะไรเพิ่ม?', a: 'ภายใน 3 วันทำการนับแต่วันเกิดรายการ · เพิ่มรายงานสินค้าและวัตถุดิบ', d: 'รายงาน 3 เล่ม: ภาษีขาย ภาษีซื้อ สินค้าและวัตถุดิบ — เลข 3-1.8-15: บันทึก 3 วัน / เกณฑ์จด 1.8 ล้าน / ยื่นวันที่ 15', star: 3, exam: false },
  { q: 'เมื่อไรต้อง "เฉลี่ยภาษีซื้อ"? มีวิธีหลักอะไรบ้าง?', a: 'กิจการ VAT + Non-VAT มีภาษีซื้อร่วมที่แยกไม่ได้ · วิธี: ตามส่วนรายได้ (ทั่วไป) / ตามพื้นที่ใช้อาคาร (ก่อสร้าง) / ตามหลักเกณฑ์อธิบดี', d: 'ประกาศฯ ฉบับ 29 — เครดิตได้เฉพาะส่วนที่เฉลี่ยเข้ากิจการ VAT ส่วนของ Non-VAT เป็นภาษีซื้อต้องห้าม (รวมเป็นต้นทุน/รายจ่ายได้)', star: 3, exam: true },
  { q: 'เกณฑ์ผ่อนปรน 90% ของการเฉลี่ยภาษีซื้อ คืออะไร?', a: 'รายได้ VAT ≥90% → เลือกเครดิตภาษีซื้อทั้งจำนวนได้ (ขอคืนภายหลังไม่ได้) · รายได้ Non-VAT ≥90% → เลือกไม่หักเลย รวมเป็นต้นทุน/รายจ่าย', d: 'ออกแบบมาลดภาระกิจการที่อีกฝั่งมีสัดส่วนน้อยมาก — จำคู่ 90/90 และผลของแต่ละทาง', star: 3, exam: false },
  { q: 'เพิ่งเริ่มกิจการยังไม่มีรายได้ เฉลี่ยภาษีซื้ออย่างไร? ปรับปรุงด้วยแบบอะไร?', a: 'ใช้ประมาณการรายได้ของปีที่เริ่มมีรายได้ → สิ้นปีปรับตามรายได้จริง ยื่น ภ.พ.30.2 ฉบับเดียว', d: 'ประมาณ > จริง → เสียเพิ่ม (ไม่มีเบี้ยปรับ/เงินเพิ่ม) · ประมาณ < จริง → ขอคืนภายใน 3 ปี · มีรายได้ปีก่อนแล้ว: เฉลี่ยตามรายได้ปีก่อน เลือกปรับ/ไม่ปรับสิ้นปี แล้วถือปฏิบัติตลอด', star: 2, exam: false },
  { q: 'ภาษีซื้อจากการก่อสร้างอาคารใช้ร่วม VAT/Non-VAT เฉลี่ยตามอะไร? ติดตามกี่ปี?', a: 'เฉลี่ยตามส่วนของประมาณการการใช้พื้นที่อาคาร · ปรับปรุงเมื่อสร้างเสร็จ/การใช้เปลี่ยน ยื่น ภ.พ.30.3 · ติดตาม 3 ปีนับแต่ก่อสร้างเสร็จ', d: 'ต่างจากกรณีทั่วไปที่ใช้ "รายได้" — อาคารใช้ "พื้นที่" · ถ้าใช้พื้นที่ไม่ตรงประมาณการ: หักเกิน → เสียเพิ่มเป็นรายเดือน / หักขาด → ขอคืน', star: 2, exam: false },
  { q: 'สินค้าขาดจากรายงานสินค้าและวัตถุดิบ มีผล VAT อย่างไร?', a: 'ถือเป็นขาย ต้องเสีย VAT จากราคาตลาด โดยไม่ต้อง (และไม่ได้) ออกใบกำกับภาษี · Tax Point = เมื่อตรวจพบ', d: 'ม.87(3), ป.86/2542, ม.79/3 วรรคท้าย — โจทย์ audit ชอบออก: นับสต๊อกขาด = โดน VAT + เบี้ยปรับ', star: 2, exam: false },

const FoundationTab = () => <SectionCards data={foundationData} />;

const FlashcardTab = () => {
  const [mode, setMode] = useState('all');
  const [order, setOrder] = useState(flashcards.map((_, i) => i));
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [score, setScore] = useState({ ok: 0, no: 0 });

  const filteredIdx = order.filter(i => {
    if (mode === 'exam') return flashcards[i].exam;
    if (mode === 'star3') return flashcards[i].star === 3;
    return true;
  });
  const total = filteredIdx.length;
  const safePos = total === 0 ? 0 : Math.min(pos, total - 1);
  const card = total > 0 ? flashcards[filteredIdx[safePos]] : null;

  const shuffle = () => {
    const arr = [...flashcards.keys()];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    setOrder(arr); setPos(0); setFlipped(false); setScore({ ok: 0, no: 0 });
  };
  const go = (d) => { setFlipped(false); setPos(p => (p + d + total) % total); };
  const mark = (ok) => {
    setScore(s => ok ? { ...s, ok: s.ok + 1 } : { ...s, no: s.no + 1 });
    go(1);
  };
  const switchMode = (m) => { setMode(m); setPos(0); setFlipped(false); setScore({ ok: 0, no: 0 }); };

  return (
    <div>
      <Flex justify="space-between" align="center" wrap="wrap" gap={12} style={{ marginBottom: 16 }}>
        <Space wrap>
          <Button type={mode === 'all' ? 'primary' : 'default'} onClick={() => switchMode('all')}>ทั้งหมด ({flashcards.length})</Button>
          <Button type={mode === 'exam' ? 'primary' : 'default'} onClick={() => switchMode('exam')}>🧮 โจทย์เด่น ({flashcards.filter(f => f.exam).length})</Button>
          <Button type={mode === 'star3' ? 'primary' : 'default'} onClick={() => switchMode('star3')}>⭐⭐⭐ สำคัญสุด ({flashcards.filter(f => f.star === 3).length})</Button>
        </Space>
        <Button onClick={shuffle}>🔀 สับไพ่</Button>
      </Flex>
      <Row gutter={12} style={{ marginBottom: 16 }}>
        <Col span={8}><Card size="small" style={{ background: C.surface3, borderColor: C.border, textAlign: 'center' }}><Statistic title="การ์ดที่" value={total === 0 ? 0 : safePos + 1} suffix={`/ ${total}`} valueStyle={{ color: C.text, fontSize: 20 }} /></Card></Col>
        <Col span={8}><Card size="small" style={{ background: C.greenBg, borderColor: C.green, textAlign: 'center' }}><Statistic title="ตอบถูก" value={score.ok} valueStyle={{ color: C.green, fontSize: 20 }} /></Card></Col>
        <Col span={8}><Card size="small" style={{ background: C.redBg, borderColor: C.red, textAlign: 'center' }}><Statistic title="ยังไม่ได้" value={score.no} valueStyle={{ color: C.red, fontSize: 20 }} /></Card></Col>
      </Row>
      {card ? (
        <div>
          <div className="fc-perspective" onClick={() => setFlipped(f => !f)}>
            <div className={'fc-card' + (flipped ? ' flipped' : '')}>
              <div className="fc-face" style={{ background: C.white, border: `2px solid ${C.borderDark}`, boxShadow: '0 4px 14px rgba(122,101,72,0.12)' }}>
                <Space direction="vertical" align="center" style={{ width: '100%' }}>
                  <Space>
                    <Stars n={card.star} />
                    {card.exam && <Tag color="volcano">🧮 โจทย์เด่น</Tag>}
                  </Space>
                  <Text strong style={{ fontSize: 19, textAlign: 'center', color: C.text }}>{card.q}</Text>
                  <Text type="secondary" style={{ marginTop: 12 }}>👆 แตะการ์ดเพื่อดูเฉลย</Text>
                </Space>
              </div>
              <div className="fc-face fc-back" style={{ background: C.surface3, border: `2px solid ${C.gold}`, boxShadow: '0 4px 14px rgba(122,101,72,0.12)' }}>
                <Space direction="vertical" align="center" style={{ width: '100%' }}>
                  <Tag color="gold" style={{ fontSize: 13 }}>คำตอบ</Tag>
                  <Text strong style={{ fontSize: 18, textAlign: 'center', color: C.amberDark }}>{card.a}</Text>
                  <Divider style={{ margin: '10px 0', borderColor: C.borderDark }} />
                  <Text style={{ fontSize: 14, textAlign: 'center', color: C.text2 }}>{card.d}</Text>
                </Space>
              </div>
            </div>
          </div>
          <Flex justify="center" gap={12} style={{ marginTop: 20 }} wrap="wrap">
            <Button onClick={() => go(-1)}>← ก่อนหน้า</Button>
            <Button danger onClick={() => mark(false)}>✗ ยังไม่ได้</Button>
            <Button type="primary" style={{ background: C.green }} onClick={() => mark(true)}>✓ ตอบได้</Button>
            <Button onClick={() => go(1)}>ถัดไป →</Button>
          </Flex>
        </div>
      ) : <Alert type="warning" message="ไม่มีการ์ดในโหมดนี้" />}
    </div>
  );
};

            </div>
          </Flex>
        </Card>
      );
    })}
  </div>
);

/* Print-friendly view: all four tabs flattened into one A4 document. */
const PrintView = () => (
  <div className="print-only" style={{ maxWidth: 900, margin: '0 auto', padding: 16, background: '#fff' }}>
    <div style={{ textAlign: 'center', marginBottom: 20 }}>
      <Title level={2} style={{ color: C.amberDark, marginBottom: 4 }}>GA513 การภาษีอากร — ภาษีมูลค่าเพิ่ม (Value Added Tax)</Title>
      <Text type="secondary">ชีทติวสอบฉบับพิมพ์ · สรุปจากเอกสารประกอบการสอน ดร.จิรารัช พิพัฒน์นราพงศ์ · UTCC บัญชีมหาบัณฑิต</Text>
    </div>
    <Title level={3} className="pv-section-title" style={{ color: C.amberDark, borderBottom: `3px solid ${C.gold}`, paddingBottom: 6 }}>ส่วนที่ 1 — ปูพื้น</Title>
    {foundationData.map(sec => (
      <div key={sec.key} style={{ marginBottom: 20 }}>
        <Title level={4} className="pv-section-title" style={{ color: C.text, borderBottom: `1px solid ${C.borderDark}`, paddingBottom: 4 }}>{sec.title}</Title>
        {sec.content()}
      </div>
    ))}
    <Title level={3} className="pv-section-title pv-page-start" style={{ color: C.amberDark, borderBottom: `3px solid ${C.gold}`, paddingBottom: 6 }}>ส่วนที่ 2 — สรุปเนื้อหา</Title>
    {summaryData.map(sec => (
      <div key={sec.key} style={{ marginBottom: 20 }}>
        <Title level={4} className="pv-section-title" style={{ color: C.text, borderBottom: `1px solid ${C.borderDark}`, paddingBottom: 4 }}>{sec.title}</Title>
        {sec.content()}
      </div>
    ))}
    <Title level={3} className="pv-section-title pv-page-start" style={{ color: C.amberDark, borderBottom: `3px solid ${C.gold}`, paddingBottom: 6 }}>ส่วนที่ 3 — Flashcard {flashcards.length} ข้อ (ถาม–ตอบ)</Title>
    {flashcards.map((f, i) => (
      <div key={i} className="no-break" style={{ border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 12px', marginBottom: 8 }}>
        <div>
          <Text strong>{i + 1}. {f.q}</Text>
          <Text> {'⭐'.repeat(f.star)}</Text>
          {f.exam && <Tag color="volcano" style={{ marginLeft: 6 }}>🧮 โจทย์เด่น</Tag>}
        </div>
        <div><Text strong style={{ color: C.amberDark }}>ตอบ: {f.a}</Text></div>
        <div><Text style={{ fontSize: 13, color: C.text2 }}>{f.d}</Text></div>
      </div>
    ))}
    <Title level={3} className="pv-section-title pv-page-start" style={{ color: C.amberDark, borderBottom: `3px solid ${C.gold}`, paddingBottom: 6 }}>ส่วนที่ 4 — การ์ดจำด่วน</Title>
    {quickSections.map((item, idx) => {
      if (item.divider) {
        return <Title key={idx} level={4} className="pv-divider" style={{ color: C.amberDark, marginTop: 16 }}>{item.divider}</Title>;
      }
      const st = typeStyle[item.type];
      return (
        <div key={idx} className="no-break" style={{ border: `1px solid ${C.border}`, borderLeft: `4px solid ${st.color}`, borderRadius: 8, padding: '6px 12px', marginBottom: 6 }}>
          <Text strong>[{item.s}] {item.t}</Text>
          <Text style={{ fontSize: 12, color: st.color }}> {st.label}</Text>
          <div><Text style={{ fontSize: 13, color: C.text2 }}>{item.b}</Text></div>
        </div>
      );
    })}
    <div style={{ textAlign: 'center', marginTop: 24, borderTop: `1px solid ${C.border}`, paddingTop: 8 }}>
      <Text type="secondary" style={{ fontSize: 12 }}>GA513 ติวสอบ ภาษีมูลค่าเพิ่ม · โชคดีในการสอบ! 🍀</Text>
    </div>
  </div>
);

const App = () => (
  <ConfigProvider theme={{
    algorithm: theme.defaultAlgorithm,
    token: {
      colorPrimary: C.gold, colorBgBase: C.bg, colorTextBase: C.text,
      colorBgContainer: C.white, colorBorder: C.border, colorBorderSecondary: C.border,
      borderRadius: 10, fontFamily: "'Noto Sans Thai', sans-serif", fontSize: 15,
    },
  }}>
    <Layout className="screen-only" style={{ minHeight: '100vh', background: C.bg }}>
      <Layout.Content style={{ maxWidth: 900, width: '100%', margin: '0 auto', padding: '28px 16px' }}>
        <div style={{ textAlign: 'center', marginBottom: 8 }}>
          <Title level={2} style={{ color: C.amberDark, marginBottom: 4 }}>📚 GA513 การภาษีอากร</Title>
          <Title level={4} style={{ color: C.text2, marginTop: 0, fontWeight: 500 }}>ภาษีมูลค่าเพิ่ม (Value Added Tax)</Title>
          <Text type="secondary">สรุปจากเอกสารประกอบการสอน ดร.จิรารัช พิพัฒน์นราพงศ์ · UTCC บัญชีมหาบัณฑิต · มิ.ย.–ก.ค. 2569</Text>
          <div style={{ marginTop: 12 }}>
            <Button onClick={() => window.print()}>🖨️ พิมพ์ / บันทึกเป็น PDF</Button>
            <div><Text type="secondary" style={{ fontSize: 12 }}>ฉบับพิมพ์รวมเนื้อหาทั้ง 4 แท็บ (ปูพื้น + สรุป + ถาม-ตอบ + การ์ดจำด่วน) พอดีกระดาษ A4</Text></div>
          </div>
        </div>
        <Tabs centered type="card" size="large" style={{ marginTop: 16 }}
          items={[
            { key: 'foundation', label: '🧱 ปูพื้น', children: <FoundationTab /> },
            { key: 'summary', label: '📖 สรุปเนื้อหา', children: <SummaryTab /> },
            { key: 'flash', label: '🃏 Flashcard', children: <FlashcardTab /> },
            { key: 'quick', label: '⚡ การ์ดจำด่วน', children: <QuickTab /> },
          ]} />
        <div style={{ textAlign: 'center', marginTop: 32, paddingTop: 16, borderTop: `1px solid ${C.border}` }}>
          <Text type="secondary" style={{ fontSize: 13 }}>สร้างจากเอกสารประกอบการสอน GA513-VAT (37 หน้า) · ใช้คู่กับรูป JPEG ทั้ง 37 หน้าในโฟลเดอร์ GA513-VAT-jpeg · โชคดีในการสอบ! 🍀</Text>
        </div>
      </Layout.Content>
    </Layout>
    <PrintView />
  </ConfigProvider>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="../../../assets/ink-tool.js?v=11" defer></script>
</body>
